# Checks this repository declares for itself, on top of amont's built-ins.
# Committed on purpose: a check nobody else installs is a check nobody else runs.
# `amont trust` accepts it, per clone — see `amont list` for what runs here.
#
# stage       name       scope       severity  command
pre-commit    typecheck  *.ts,*.tsx  block     pnpm run typecheck

# duro doctor: @duro-app/ui build wiring (runtimeInjection, stylesheet
# import and CSS layer order). Scope = the files it reads in this repo.
pre-commit  duro-doctor  *.css,package.json,postcss.config.js,root.tsx,vite.config.ts,vitest.config.ts,vitest.integration.config.ts  block  npx -y @duro-app/cli@^5.4.0 doctor

# amont:pack:start github:fredericrous/adr-lint 3c0b5fe8244868f15e2056d9c921bef5fc652dac
pre-commit  adr-lint-check  *.rs,*.ts,*.tsx,*.go,*.py+.adr.yaml  warn  files adr-lint check --
pre-push  adr-lint-candidates  *.rs,*.ts,*.tsx,*.go,*.py+.adr.yaml  warn  adr-lint candidates --base default
pre-push  adr-lint-cli-probe  +adr-lint.toml  warn  heavy adr-lint cli-probe
# amont:pack:end github:fredericrous/adr-lint
# ADR-0044: this repository is at 0 exact findings, so the exact rules block here.
severity  pre-commit-adr-lint-check  block
