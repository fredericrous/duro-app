# Checks this repository declares for itself, on top of amont's built-ins.
# Committed on purpose: a check nobody else installs is a check nobody else runs.
# `amont trust` accepts it, per clone — see `amont list` for what runs here.
#
# stage       name       scope       severity  command
pre-commit    typecheck  *.ts,*.tsx  block     npm run typecheck

# duro doctor: @duro-app/ui build wiring (runtimeInjection, stylesheet
# import and CSS layer order). Scope = the files it reads in this repo.
pre-commit  duro-doctor  *.css,package.json,postcss.config.js,root.tsx,vite.config.ts,vitest.config.ts,vitest.integration.config.ts  block  npx -y @duro-app/cli@^3.4.0 doctor
