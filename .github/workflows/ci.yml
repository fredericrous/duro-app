name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hosted runners only (2026-09-21). 90 days of ARC history: queue p90 of
# 15 min on the test shards whose p50 is 7-9 min, 3.7 min on Build & Test;
# ubuntu-latest picks up in seconds with 4 vCPU / 16 GB and costs nothing on a
# public repo. The migration check, the one job that needed the cluster, is
# now pull-based: see `pr-image` at the bottom.
jobs:
  # Detect whether this PR actually changes DB migrations. The prod-data-clone
  # migration check restores a full CNPG clone in the cluster (~12 min warm),
  # so we only pay for it when the schema could actually be affected.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'app/lib/db/migrations/**'
              - 'app/lib/db/client.server.ts'

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # No `services: postgres:` — the test suite runs against PGlite via
    # makeTestDbLayer in app/lib/db/client.server.ts. PgClientLive (which
    # would consume DATABASE_URL) is not built by any test layer.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `npm run build` can compile green while react-router-serve (SSR) still
      # dies at boot (bad server bundle, missing runtime export, etc.). This
      # boots the production bundle and curls /health, which is dependency-free
      # (returns {"status":"ok"} with no DB), so no Postgres is needed.
      - name: Smoke — server boots & serves
        run: |
          npm run start & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/health \
            || { echo "::error::server did not serve /health within 30s"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID

      - name: Type check
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

  # The suite is sharded across two runners: each keeps the same per-worker
  # budget (maxWorkers: 2, see vitest.config.ts), so wall time roughly halves
  # without re-introducing the fork-starvation flakes that capped concurrency
  # in the first place. Coverage is collected per shard as a blob and
  # merged+gated in `coverage-gate` — per-shard coverage numbers alone would
  # be meaningless against the thresholds.
  test:
    name: Test (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (shard, coverage blob)
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npx vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/2

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  # A real OPAQUE handshake against the real LLDAP image production runs.
  #
  # This job exists because of a shipped outage: account creation could not
  # succeed for anyone, because LldapClient posted to OPAQUE routes LLDAP does
  # not have. LLDAP serves its admin SPA from a catch-all, so the wrong path
  # answered `200 text/html` — the request passed its status check and died on
  # JSON parsing, blaming the payload rather than the URL. The unit suite was
  # green throughout: it mocks the HTTP layer that was itself wrong. Only a live
  # LLDAP distinguishes "the client speaks this protocol" from "the client
  # speaks to a server that exists".
  #
  # LLDAP runs as a plain `docker run` rather than a `services:` container:
  # the image has no /data and its entrypoint refuses to create one, and a
  # service container cannot override the entrypoint. `--network host` puts
  # the server on localhost of the runner, and it runs inside the image's own
  # musl rootfs (the binary is Alpine-linked). Under ARC this was a rootless
  # Buildah dance because the pod had no docker socket; hosted runners have one.
  integration:
    name: OPAQUE handshake (real LLDAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Pinned by digest to the exact image the cluster runs, so this test tracks
      # production rather than a floating tag. Bump both together.
      LLDAP_IMAGE: ghcr.io/fredericrous/lldap:opaque-ke-4@sha256:cc7953e8ad1f0120c9d61b637556a47f6c84c5a98dc72fc3f797ae5730c9c44a
      LLDAP_URL: http://localhost:17170
      # Throwaway credentials for an ephemeral container that holds no real data.
      LLDAP_ADMIN_PASS: ci-admin-password
      LLDAP_JWT_SECRET: ci-not-a-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start LLDAP
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Run the binary directly rather than the image's entrypoint, which
          # insists on a /data the image does not ship and then dies on an
          # unbound $GID. This is what the homelab Deployment does too. SQLite
          # under /tmp keeps the whole thing stateless and volume-free.
          docker run -d --name lldap --network host \
            -e LLDAP_JWT_SECRET="$LLDAP_JWT_SECRET" \
            -e LLDAP_LDAP_USER_PASS="$LLDAP_ADMIN_PASS" \
            -e LLDAP_LDAP_BASE_DN=dc=ci,dc=test \
            -e LLDAP_HTTP_PORT=17170 \
            -e LLDAP_DATABASE_URL="sqlite:///tmp/lldap.db?mode=rwc" \
            -e LLDAP_KEY_FILE=/tmp/lldap_key \
            --entrypoint /app/lldap "$LLDAP_IMAGE" run
          for _ in $(seq 1 90); do
            curl -fsS "$LLDAP_URL/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "$LLDAP_URL/health" \
            || { echo "::error::LLDAP did not serve /health within 90s"; docker logs lldap; exit 1; }

      - name: Integration tests
        run: npm run test:integration

      - name: LLDAP log (on failure)
        if: failure()
        run: docker logs lldap || true

  coverage-gate:
    name: Coverage gate (merged shards)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports & enforce coverage thresholds
        # Replays the recorded shard results (no tests re-run) and generates
        # the merged coverage report; vitest.config.ts thresholds gate here,
        # locking in the current floor and forcing future PRs to maintain or
        # raise it.
        run: npx vitest run --merge-reports --coverage

  # Pull-based migration check (phase 2, 2026-09-21). The cluster does the
  # work: this job only publishes the artifact and hands the check over. It
  # builds the PR image, pushes ghcr.io/fredericrous/duro-app:pr-<head sha> and
  # adds the `migration-check` label; homelab's Flux ResourceSetInputProvider
  # lists labelled PRs every 2 min and creates one MigrationCheck per PR, which
  # homelab-preview-operator runs (prod-data clone + this image + /health/ready)
  # and reports back as the "Migration check (prod-data clone)" check run on
  # the head sha. No kubectl, no service account, no cluster access here.
  #
  # Same path filter as before (233 of 263 runs in 90 days were skipped by it).
  # The image is built from the PR merge ref that actions/checkout gives a
  # pull_request run, i.e. the change on top of main, and tagged with the head
  # sha the check run attaches to.
  pr-image:
    name: PR image for the migration check
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/fredericrous/duro-app:pr-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NPM_REGISTRY stays at the Dockerfile default (public npm); every
      # dependency, @duro-app/* included, is public.
      - name: Build and push the PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hand the check to the cluster
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label migration-check
          echo "pushed $IMAGE and labelled the PR; the cluster runs the check from here"
