name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detect whether this PR actually changes DB migrations. The prod-data-clone
  # migration check spins up a fresh Ceph-snapshot CNPG clone (~7-10 min, and
  # flaky when the clone provisioning brushes the timeout), so we only pay for
  # it when the schema could actually be affected.
  changes:
    name: Detect changes
    runs-on: duro-app
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'app/lib/db/migrations/**'
              - 'app/lib/db/client.server.ts'

  build-and-test:
    name: Build & Test
    runs-on: duro-app
    permissions:
      contents: read
      packages: read

    # No `services: postgres:` — the dind-less self-hosted runner has no
    # docker socket, and the test suite already runs against PGlite via
    # makeTestDbLayer in app/lib/db/client.server.ts. PgClientLive (which
    # would consume DATABASE_URL) is not built by any test layer.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `npm run build` can compile green while react-router-serve (SSR) still
      # dies at boot (bad server bundle, missing runtime export, etc.). This
      # boots the production bundle and curls /health, which is dependency-free
      # (returns {"status":"ok"} with no DB), so no Postgres is needed.
      - name: Smoke — server boots & serves
        run: |
          npm run start & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/health \
            || { echo "::error::server did not serve /health within 30s"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID

      - name: Type check
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

  # The suite is sharded across two runner pods: each pod keeps the same
  # per-worker CPU budget as before (maxWorkers: 2 under its cgroup quota),
  # so wall time roughly halves without re-introducing the fork-starvation
  # flakes that capped concurrency in the first place. Coverage is collected
  # per shard as a blob and merged+gated in `coverage-gate` — per-shard
  # coverage numbers alone would be meaningless against the thresholds.
  test:
    name: Test (shard ${{ matrix.shard }}/2)
    runs-on: duro-app
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (shard, coverage blob)
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npx vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/2

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  # A real OPAQUE handshake against the real LLDAP image production runs.
  #
  # This job exists because of a shipped outage: account creation could not
  # succeed for anyone, because LldapClient posted to OPAQUE routes LLDAP does
  # not have. LLDAP serves its admin SPA from a catch-all, so the wrong path
  # answered `200 text/html` — the request passed its status check and died on
  # JSON parsing, blaming the payload rather than the URL. The unit suite was
  # green throughout: it mocks the HTTP layer that was itself wrong. Only a live
  # LLDAP distinguishes "the client speaks this protocol" from "the client
  # speaks to a server that exists".
  #
  # LLDAP runs under Buildah rather than as a `services:` container for two
  # reasons: the image has no /data and its entrypoint refuses to create one
  # (a service container cannot override the command to mkdir it), and
  # service-container semantics under ARC's Kubernetes hooks are explicitly
  # unreviewed here (see homelab docs/arc-k8s-ci-migration.md). Rootless
  # `buildah run` uses the host network namespace, so the server is reachable on
  # localhost of the job pod, and it runs inside the image's own musl rootfs —
  # the binary is Alpine-linked and will not run on the Debian Node image.
  integration:
    name: OPAQUE handshake (real LLDAP)
    runs-on: duro-app-ci
    permissions:
      contents: read
      packages: read
    container:
      image: quay.io/buildah/stable
    env:
      # Pinned by digest to the exact image the cluster runs, so this test tracks
      # production rather than a floating tag. Bump both together.
      LLDAP_IMAGE: ghcr.io/fredericrous/lldap:opaque-ke-4@sha256:cc7953e8ad1f0120c9d61b637556a47f6c84c5a98dc72fc3f797ae5730c9c44a
      LLDAP_URL: http://localhost:17170
      # Throwaway credentials for an ephemeral container that holds no real data.
      LLDAP_ADMIN_PASS: ci-admin-password
      LLDAP_JWT_SECRET: ci-not-a-secret
      STORAGE_DRIVER: vfs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start LLDAP
        run: |
          set -euo pipefail
          buildah --storage-driver=vfs from --name lldap "$LLDAP_IMAGE"
          # Run the binary directly rather than the image's entrypoint, which
          # insists on a /data the image does not ship and then dies on an
          # unbound $GID. This is what the homelab Deployment does too. SQLite
          # under /tmp keeps the whole thing stateless and volume-free.
          buildah --storage-driver=vfs config \
            --env LLDAP_JWT_SECRET="$LLDAP_JWT_SECRET" \
            --env LLDAP_LDAP_USER_PASS="$LLDAP_ADMIN_PASS" \
            --env LLDAP_LDAP_BASE_DN=dc=ci,dc=test \
            --env LLDAP_HTTP_PORT=17170 \
            --env LLDAP_DATABASE_URL="sqlite:///tmp/lldap.db?mode=rwc" \
            --env LLDAP_KEY_FILE=/tmp/lldap_key \
            lldap
          # `buildah run` executes inside the image's own musl rootfs (the
          # binary is Alpine-linked) while sharing the pod's network namespace,
          # so the server answers on localhost of this job.
          buildah --storage-driver=vfs run --net host lldap -- /app/lldap run \
            > /tmp/lldap.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS "$LLDAP_URL/health" >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "$LLDAP_URL/health" \
            || { echo "::error::LLDAP did not serve /health within 90s"; cat /tmp/lldap.log; exit 1; }

      - name: Integration tests
        run: npm run test:integration

      - name: LLDAP log (on failure)
        if: failure()
        run: cat /tmp/lldap.log || true

  coverage-gate:
    name: Coverage gate (merged shards)
    needs: test
    runs-on: duro-app
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports & enforce coverage thresholds
        # Replays the recorded shard results (no tests re-run) and generates
        # the merged coverage report; vitest.config.ts thresholds gate here,
        # locking in the current floor and forcing future PRs to maintain or
        # raise it.
        run: npx vitest run --merge-reports --coverage

  migration-check:
    name: Migration check (prod-data clone)
    needs: changes
    # Only run when migrations (or the DB client) actually change — most PRs
    # don't, and the clone is slow + flaky. Guards schema-changing PRs only.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.migrations == 'true' }}
    runs-on: duro-app
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      MC_NS: migration-check
      MC_NAME: duro-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install kubectl
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure in-cluster kubeconfig (scoped SA)
        run: |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster k8s \
            --server="https://kubernetes.default.svc" \
            --certificate-authority="$SA/ca.crt" --embed-certs=true
          kubectl config set-credentials sa --token="$(cat $SA/token)"
          kubectl config set-context ctx --cluster=k8s --user=sa --namespace="$MC_NS"
          kubectl config use-context ctx

      - name: Request a prod-data clone (MigrationCheck)
        run: |
          cat <<YAML | kubectl apply -f -
          apiVersion: preview.homelab.io/v1
          kind: MigrationCheck
          metadata:
            name: ${MC_NAME}
            namespace: ${MC_NS}
          spec:
            appName: duro
            # Must exceed the Ready wait (~25m) plus build + migrate + serve, or
            # the operator GCs the clone mid-test.
            ttlSeconds: 2700
          YAML

      - name: Wait for clone to be Ready
        run: |
          for i in $(seq 1 300); do   # up to ~25m — warm clone bring-up measured ~11.5m (IO-bound postgres startup off an encrypted 30Gi snapshot); cold snapshots spike higher
            phase=$(kubectl -n "$MC_NS" get migrationcheck "$MC_NAME" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "phase=$phase ($i)"
            case "$phase" in
              Ready)  exit 0 ;;
              Failed) echo "::error::MigrationCheck failed: $(kubectl -n "$MC_NS" get migrationcheck "$MC_NAME" -o jsonpath='{.status.message}')"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::clone did not become Ready in time"; exit 1

      - name: Read clone DATABASE_URL
        id: db
        run: |
          secret=$(kubectl -n "$MC_NS" get migrationcheck "$MC_NAME" -o jsonpath='{.status.connectionSecretName}')
          url=$(kubectl -n "$MC_NS" get secret "$secret" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)
          echo "::add-mask::$url"
          echo "database_url=$url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Boot against the prod-data clone: building AppLayer runs the in-process
      # migrations (DbLive/MigratorLive in app/lib/db/client.server.ts) against
      # real data, then /health/ready (DB-aware `SELECT 1`) proves a DB-backed
      # request works. The dummy LLDAP/SMTP/Vault/SESSION vars satisfy the
      # Live layers' build-time Config reads (they construct clients lazily and
      # never connect at build), so AppLayer fully builds and /health/ready can
      # return 200 — otherwise the layer build would fail and mask migrations.
      - name: Run migrations + serve against clone
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
          SESSION_SECRET: ci-migration-check-dummy-session-secret
          LLDAP_ADMIN_PASS: ci-dummy
          NAS_VAULT_ADDR: http://127.0.0.1:8200
          NAS_VAULT_TOKEN: ci-dummy
          SMTP_HOST: localhost
          SMTP_USER: ci-dummy
          SMTP_PASS: ci-dummy
        run: |
          npm run start & SERVER_PID=$!
          ok=
          for i in $(seq 1 60); do   # generous: migrations run on first boot
            if curl -fsS http://localhost:3000/health/ready | grep -q '"status":"ready"'; then ok=1; break; fi
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true
          [ -n "$ok" ] || { echo "::error::migrations/health failed against the prod-data clone"; exit 1; }
          echo "migrations applied + /health/ready green against prod-data clone"

      - name: Tear down the clone
        if: always()
        run: kubectl -n "$MC_NS" delete migrationcheck "$MC_NAME" --ignore-not-found --wait=false
