# Checks this repository declares for itself, on top of amont's built-ins.
# Committed on purpose: a check nobody else installs is a check nobody else runs.
# `amont trust` accepts it, per clone — see `amont list` for what runs here.
#
# stage       name       scope       severity  command
pre-commit    typecheck  *.ts,*.tsx  block     pnpm run typecheck

# greenrack doctor: @greenharness/greenrack-ui build wiring (runtimeInjection, stylesheet
# import and CSS layer order). Scope = the files it reads in this repo.
pre-commit  greenrack-doctor  *.css,package.json,postcss.config.js,root.tsx,vite.config.ts,vitest.config.ts,vitest.integration.config.ts  block  npx -y @greenharness/greenrack-cli@^7 doctor

# ADR-0044: this repository is at 0 exact findings, so the exact rules block here.
severity  pre-commit-greenspotter-check  block

# greengate:pack:start github:greenharness/greenspotter 2f6a0814e0929f067be65fbb92c8ae7cfc9c75d8
pre-commit  greenspotter-check  *.rs,*.ts,*.tsx,*.mts,*.cts,*.go,*.py,greenspotter.toml,adr-lint.toml,tsconfig.json,tsconfig.base.json,tsconfig.app.json,tsconfig.node.json,pyproject.toml,go.mod+.adr.yaml  warn  files greenspotter check --
pre-push  greenspotter-candidates  *.rs,*.ts,*.tsx,*.go,*.py+.adr.yaml  warn  greenspotter candidates --base default
pre-push  greenspotter-cli-probe  +greenspotter.toml,adr-lint.toml  warn  heavy greenspotter cli-probe
# greengate:pack:end github:greenharness/greenspotter
